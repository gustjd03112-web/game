<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>청운대학교</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
        }

        #game {
            width: 100vw;
            height: 100vh;
            display: block;
            background: #000000;
        }

        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
